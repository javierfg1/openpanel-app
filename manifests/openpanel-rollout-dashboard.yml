apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: openpanel-dashboard
  namespace: openpanel
# Añadir anotaciones para que escrapear métricas
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"   # 👈 puerto real del container
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  strategy:
    blueGreen:
      activeService: openpanel-dashboard-active
      previewService: openpanel-dashboard-preview
      # Recibe tráfico por lo que antes de promocionar podría ser conveniente controlar que todo este bien (sería false en este caso)
      autoPromotionEnabled: true
  selector:
    matchLabels:
      app: openpanel-dashboard
  template:
    metadata:
      labels: 
        app: openpanel-dashboard
    spec:
      containers:
        - name: openpanel-dashboard
          # al principo cuando aplicamo este yml, intenta buscar la imagen pero no a encuentra, por eso hay que hacer el rollout vía cmd
          image: ghcr.io/javierfg1/dashboard
          env:
            # Una vez desplegados, hacer port forward para probar
              - name: NEXT_PUBLIC_API_URL
              # Ponemos EL SERVICIO DEL API para luego hacer port forward
                value: "http://openpanel-api-active:8087"
              # Una vez desplegados, hacer port forward para probar
              - name: ORACLE_USER
                valueFrom:
                    secretKeyRef:
                        name: oracle-credentials
                        key: ORACLE_USER
              - name: ORACLE_PASSWORD
                valueFrom:
                    secretKeyRef:
                        name: oracle-credentials
                        key: ORACLE_PASSWORD
              - name: DATABASE_URL
                value: postgresql://$(ORACLE_USER):$(ORACLE_PASSWORD)@op-db:5432/postgres
              - name: REDIS_URL
                value: redis://op-kv:6379
          ports:
            - containerPort: 3000