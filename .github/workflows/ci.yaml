name: CI OpenPanel

on:
  push:
    branches: [main, staging]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        service: [api, public, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
          else
            echo "VERSION=$(jq -r .version package.json)-dev" >> $GITHUB_ENV
          fi

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USER }}/openpanel-${{ matrix.service }}:$VERSION \
            -f apps/${{ matrix.service }}/Dockerfile .

      - name: Push version tag
        run: |
          docker push ${{ secrets.DOCKER_USER }}/openpanel-${{ matrix.service }}:$VERSION

      - name: Tag latest
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag \
            ${{ secrets.DOCKER_USER }}/openpanel-${{ matrix.service }}:$VERSION \
            ${{ secrets.DOCKER_USER }}/openpanel-${{ matrix.service }}:latest

          docker push ${{ secrets.DOCKER_USER }}/openpanel-${{ matrix.service }}:latest